<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Designer Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 260'%3E%3Crect width='200' height='260' rx='40' fill='black'/%3E%3Cmask id='b'%3E%3Crect width='200' height='260' fill='white'/%3E%3Ccircle cx='159' cy='116' r='19'/%3E%3Ccircle cx='155' cy='142' r='22'/%3E%3Ccircle cx='161' cy='168' r='18'/%3E%3C/mask%3E%3Cpath mask='url(%23b)' fill='white' d='M100 44C82 44 75 62 73 82C71 104 47 124 45 168C43 214 70 246 100 246C130 246 157 214 155 168C153 124 129 104 127 82C125 62 118 44 100 44Z'/%3E%3Cpath d='M101 46C100 32 104 21 113 12' stroke='white' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --app:#161616; --win:#1e1e1e; --panel:#232323; --bar:#2c2c2c; --field:#121212;
  --sep:#0b0b0b; --text:#e4e4e4; --mut:#9b9b9b; --dim:#6c6c6c;
  --acc:#7c7cff; --acc2:#5e5ce6; --sel:#f5d547; --play:#ff453a;
  --clip:#3e56ad; --clip2:#2d3f80; --green:#7cb518; --green2:#5a8a10;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--app);color:var(--text);font:12.5px/1.4 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:var(--text)}
button{background:none;border:0;cursor:pointer;padding:0}
svg.i{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
svg.i.s{width:14px;height:14px} svg.i.l{width:20px;height:20px}
input,select,textarea{background:var(--field);border:1px solid #3a3a3a;border-radius:5px;padding:5px 7px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 2px #5e5ce655}
textarea{resize:vertical;min-height:56px}
input[type=checkbox]{width:auto;accent-color:var(--acc2)}
input[type=color]{padding:1px;height:28px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:26px;min-width:30px;padding:0 7px;border-radius:5px;color:#cfcfcf}
.ib:hover{background:#ffffff14} .ib.on{color:var(--acc)} .ib:disabled{opacity:.35;cursor:default}
.ib.box{background:#3a3a3a;border:1px solid #474747;min-width:28px;padding:0 5px} .ib.box:hover{background:#444}
.btn{height:26px;padding:0 12px;border-radius:5px;background:#4a4a4a;color:#eee;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{background:#555} .btn.pri{background:var(--acc2);color:#fff} .btn.pri:hover{background:#6d6bf0}
.btn.ghost{background:transparent;border:1px solid #4a4a4a} .btn.danger{color:#ff6b62} .btn:disabled{opacity:.4;cursor:default}
.mut{color:var(--mut)} .dim{color:var(--dim)} .err{color:#ff6b62}
.cap{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
label.f{display:block;color:var(--mut);font-size:11px;margin:9px 0 3px}
.row{display:flex;gap:6px;align-items:center} .grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

/* ---------- app frame (pro editor layout) ---------- */
#app{display:grid;grid-template-rows:42px minmax(260px,57vh) 34px minmax(0,1fr);height:100vh;background:var(--sep);gap:1px}
.tb{background:linear-gradient(#333,#2a2a2a);display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid #000;min-width:0}
.tb .grp{display:flex;gap:6px;align-items:center}
.tb .ib{height:28px;min-width:36px;background:#3d3d3d;border:1px solid #4a4a4a;border-radius:6px}
.tb .ib:hover{background:#474747}
.tb .seg{display:flex;background:#3d3d3d;border:1px solid #4a4a4a;border-radius:6px;overflow:hidden}
.tb .seg .ib{border:0;border-radius:0;background:transparent;min-width:40px}
.tb .seg .ib+.ib{border-left:1px solid #4a4a4a}
.tb .seg .ib.on{background:#2a2a5a;color:var(--acc)}
.brand{display:flex;align-items:center;gap:7px;font-weight:600;color:#ddd;margin:0 8px;white-space:nowrap}
.brand svg{width:13px;height:17px}
.ring{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p,0)*1%),#555 0);display:grid;place-items:center}
.ring::after{content:"";width:10px;height:10px;border-radius:50%;background:#3d3d3d}
#taskTxt{max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}

.top{display:grid;grid-template-columns:210px minmax(240px,1fr) minmax(320px,1.35fr) 320px;gap:1px;min-height:0;background:var(--sep)}
#app.nobrowser .top{grid-template-columns:0 0 minmax(320px,1fr) 320px}
#app.noinsp .top{grid-template-columns:210px minmax(240px,1fr) minmax(320px,1.35fr) 0}
#app.nobrowser.noinsp .top{grid-template-columns:0 0 1fr 0}
#app.notl{grid-template-rows:42px minmax(0,1fr) 34px 0}
.pane{background:var(--win);min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.phd{height:32px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--sep);white-space:nowrap;min-width:0}
.scroll{overflow:auto;min-height:0;flex:1}

/* library sidebar */
.lib{background:#1c1c1c}
.tree{padding:6px 0;user-select:none}
.tree .it{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 calc(8px + var(--d,0)*14px);cursor:pointer;white-space:nowrap;overflow:hidden}
.tree .it:hover{background:#2a2a2a} .tree .it.on{background:#3d3d58}
.tree .it .tw{width:10px;color:var(--mut);font-size:9px;flex:none}
.tree .it .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.tree .it .dot{width:7px;height:7px;border-radius:50%;background:var(--acc2);flex:none}
.tree .it .ct{color:var(--dim);font-size:11px}
.tbox{width:15px;height:15px;border:1px solid #777;border-radius:2px;display:grid;place-items:center;color:#bbb;flex:none}
.tbox svg{width:11px;height:11px}

/* browser */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 10px;padding:12px}
.tile{cursor:pointer;position:relative}
.tile .th{position:relative;aspect-ratio:9/16;background:#000;border:2px solid transparent;border-radius:3px;overflow:hidden}
.tile.a45 .th{aspect-ratio:4/5} .tile.a11 .th{aspect-ratio:1/1} .tile.wide .th{aspect-ratio:16/10}
.tile .th img{width:100%;height:100%;object-fit:cover;display:block}
.tile.on .th{border-color:var(--sel)}
.tile .nm{font-size:11.5px;margin-top:4px;line-height:1.25;color:#d6d6d6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .dot{position:absolute;left:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--acc2);box-shadow:0 0 0 1.5px #0008;z-index:1}
.tile .sc{position:absolute;right:4px;bottom:4px;font-size:10.5px;font-weight:700;background:#000b;border-radius:4px;padding:0 4px}
.tile .sc.hot{background:var(--sel);color:#000}
.tile .busy{position:absolute;inset:0;background:#000a;display:grid;place-items:center;font-size:11px;color:#ddd}
.tile .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:11px;text-align:center;padding:6px}

/* viewer */
.vhd{justify-content:space-between}
.stage{flex:1;min-height:0;background:#0f0f0f;display:flex;align-items:center;justify-content:center;position:relative}
.stage video{max-width:100%;max-height:100%;background:#000;display:block}
.stage .empty{color:var(--dim);text-align:center;padding:20px}
.stage .badge{position:absolute;left:10px;top:8px;font-size:10.5px;color:#bbb;background:#000a;border-radius:4px;padding:2px 6px;z-index:1}
.transport{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:var(--panel);border-top:1px solid var(--sep)}
.tc{font:300 21px/1 "SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.5px;font-variant-numeric:tabular-nums;color:#eee}
.tc .z{color:#555}
.playb{color:#eee;width:30px;height:30px}

/* inspector */
.itabs{display:flex;gap:2px} .itabs .ib{min-width:28px;height:24px}
.ibody{padding:10px 12px 18px}
.wheels{display:grid;grid-template-columns:1fr 1fr;gap:8px 4px;justify-items:center;margin:4px 0 10px}
.wheels .w0{grid-column:1/-1}
.wh{display:flex;flex-direction:column;align-items:center;gap:5px}
.wh .in{position:relative;width:var(--s);height:var(--s)}
.wh .ringw{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 225deg,#5e5ce6,#a74af0 calc(var(--v)*.25deg),#ff4f8b calc(var(--v)*.5deg),#ff9f40 calc(var(--v)*.75deg),#f5d547 calc(var(--v)*1deg),#2b2b2b 0);
  -webkit-mask:radial-gradient(circle,transparent 57%,#000 58%);mask:radial-gradient(circle,transparent 57%,#000 58%)}
.wh .in i{position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,#2b2b2b,#1a1a1a);box-shadow:inset 0 0 0 1px #333}
.wh .in b{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--s)*.25);font-weight:600}
.hooks{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.chip{font-size:11.5px;padding:5px 8px;border-radius:5px;background:#2a2a2a;border:1px solid #393939;text-align:left;color:#ccc}
.chip.on{border-color:var(--sel);color:#fff}
.segc{display:flex;background:#2a2a2a;border:1px solid #3a3a3a;border-radius:7px;padding:2px;gap:2px}
.segc button{flex:1;height:24px;border-radius:5px;color:#ccc;font-size:12px}
.segc button.on{background:#4a4a4a;color:#fff}
.sect{border-top:1px solid #2f2f2f;margin-top:12px;padding-top:10px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.met{display:grid;grid-template-columns:1.3fr repeat(5,1fr) 22px;gap:3px;margin-top:4px;align-items:start}
.met input,.met select{padding:3px 4px;font-size:11px}
.methead{display:grid;grid-template-columns:1.3fr repeat(5,1fr) 22px;gap:3px;font-size:10px;color:var(--mut);margin-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px} .kv span:nth-child(odd){color:var(--mut)}

/* timeline toolbar */
.tlbar{background:var(--panel);display:flex;align-items:center;gap:4px;padding:0 8px;min-width:0}
.tlbar .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;color:#ddd;min-width:0}
.tlbar .mid .pn{font-weight:600;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlbar .sepv{width:1px;height:18px;background:#444;margin:0 4px}

/* timeline */
.bottom{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:1px;min-height:0;background:var(--sep)}
#app.noinsp .bottom{grid-template-columns:1fr 0}
.tl{background:#1a1a1a}
.tlscroll{overflow:auto;flex:1;position:relative;min-height:0}
.tlin{position:relative;min-height:100%}
.ruler{position:sticky;top:0;height:24px;background:#1f1f1f;border-bottom:1px solid #2c2c2c;z-index:3;cursor:text}
.ruler .tk{position:absolute;bottom:0;width:1px;background:#4a4a4a;height:6px}
.ruler .tk.M{height:12px;background:#777}
.ruler .lb{position:absolute;top:3px;font:10.5px "SF Mono",ui-monospace,Menlo,monospace;color:#9a9a9a;padding-left:4px;white-space:nowrap}
.lane{position:relative;margin:6px 0}
.lane .lt{position:sticky;left:4px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;height:13px;z-index:1;display:inline-block}
.rg{position:absolute;top:14px;bottom:0;border-radius:4px;overflow:hidden;cursor:pointer;border:1px solid #0006}
.rg .lab{font-size:10.5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:#fff;text-shadow:0 1px 1px #0008}
.lane.clips .rg{background:var(--green2);border-color:#00000080}
.lane.clips .rg .lab{background:var(--green);color:#10200a;text-shadow:none}
.lane.clips .rg .body{position:absolute;inset:16px 0 0;background:repeating-linear-gradient(90deg,#cfe8a055 0 2px,transparent 2px 5px)}
.lane.clips .rg.on{box-shadow:0 0 0 2px var(--sel);z-index:2}
.lane.clips .rg.nofile{opacity:.6;background:#4b5d2b}
.story{position:absolute;top:14px;height:96px;border-radius:5px;background:var(--clip2);border:1px solid #6b82d6;overflow:hidden;cursor:text}
.story .nm{position:absolute;left:0;right:0;top:0;height:15px;font-size:10.5px;padding:0 6px;background:var(--clip);color:#e6ebff;white-space:nowrap}
.story .fs{position:absolute;left:0;right:0;top:15px;height:52px;background-size:100% 100%;background-repeat:no-repeat;background-color:#26356a}
.story .wv{position:absolute;left:0;right:0;bottom:0;height:29px;background-size:100% 100%;background-color:#2b3c7a;border-top:1px solid #1e2b5c}
.story .mk{position:absolute;top:15px;bottom:0;background:#f5d54718;border-left:1px solid #f5d54788;border-right:1px solid #f5d54788;pointer-events:none}
.phd2{position:absolute;top:0;bottom:0;width:1px;background:var(--play);z-index:4;pointer-events:none}
.phd2::before{content:"";position:absolute;top:0;left:-5px;border:5px solid transparent;border-top:7px solid var(--play)}
.tlempty{color:var(--dim);padding:24px;text-align:center}

/* effects browser */
.fx{display:grid;grid-template-rows:32px minmax(0,1fr) 30px}
.fxbody{display:grid;grid-template-columns:130px 1fr;min-height:0}
.fxcats{background:#1c1c1c;border-right:1px solid var(--sep);overflow:auto;padding:4px 0}
.fxcats div{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;cursor:pointer;color:#d6d6d6}
.fxcats div:hover{background:#2a2a2a} .fxcats div.on{background:#3a3a3a}
.fxcats .dot{width:6px;height:6px;border-radius:50%;background:var(--acc2)}
.fxgrid{overflow:auto;padding:8px 10px 14px}
.fxgrid h4{margin:2px 0 8px;font-size:12px;color:var(--mut);font-weight:600}
.fxtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px 10px;margin-bottom:12px}
.fxt{cursor:pointer}
.fxt .pv{aspect-ratio:16/10;border-radius:4px;overflow:hidden;position:relative;border:2px solid transparent;background:linear-gradient(160deg,#6b4b3a,#c07a4a 55%,#3a2a24)}
.fxt.on .pv{border-color:var(--sel)}
.fxt .nm{font-size:11px;margin-top:3px;color:#d0d0d0}
.fxt .dot{position:absolute;left:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--acc2);z-index:1}
.pvtxt{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16%;font:800 12px/1 var(--font);color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 3px #000;letter-spacing:.02em}
.fxfoot{display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--panel);border-top:1px solid var(--sep)}
.fxfoot input{height:22px;padding:2px 6px}

/* sheets */
dialog{background:#262626;color:var(--text);border:1px solid #444;border-radius:12px;padding:0;width:min(820px,95vw);max-height:90vh;box-shadow:0 20px 60px #000c}
dialog::backdrop{background:#0008}
.sheet{display:flex;flex-direction:column;max-height:90vh}
.sheet .sh{padding:12px 16px 4px;font-weight:600;font-size:14px}
.sheet .sb{padding:6px 16px 12px;overflow:auto}
.sheet .sf{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid #353535;background:#222;border-radius:0 0 12px 12px}
.imp{display:grid;grid-template-columns:140px 1fr;gap:12px}
.imp .src div{height:26px;display:flex;align-items:center;gap:7px;padding:0 8px;border-radius:5px;cursor:pointer}
.imp .src div.on{background:var(--acc2);color:#fff}
.list{max-height:230px;overflow:auto;border:1px solid #3a3a3a;border-radius:6px;background:var(--field)}
.list div{padding:6px 9px;border-bottom:1px solid #222;cursor:pointer;display:flex;gap:8px;align-items:center}
.list div:hover{background:#1f1f2b} .list div.on{background:#2e2e5a}
.list small{color:var(--mut)} .list .tag{font-size:10px;background:#2b3f66;border-radius:4px;padding:1px 5px;flex:none}
.checks{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;align-items:center} .checks label{display:flex;gap:6px;align-items:center}
.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tr{max-height:56vh;overflow:auto;border:1px solid #3a3a3a;border-radius:6px}
.tr p{margin:0;padding:6px 9px;border-bottom:1px solid #2a2a2a;cursor:pointer;display:flex;gap:10px}
.tr p:hover{background:#2a2a2a} .tr p.sel{background:#3a3520} .tr p span{color:var(--mut);flex:none;width:44px;font-variant-numeric:tabular-nums}
.log{background:#111;border-radius:6px;padding:8px;font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:220px;overflow:auto;color:#c8ccd4}
.pbar{height:5px;background:#3a3a3a;border-radius:3px;overflow:hidden;margin:6px 0} .pbar i{display:block;height:100%;background:var(--acc2)}
table.t{width:100%;border-collapse:collapse;font-size:12px} table.t th,table.t td{text-align:left;padding:5px 7px;border-bottom:1px solid #333;vertical-align:top}
table.t th{color:var(--mut);font-weight:600} table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px} .kpi{background:#1e1e1e;border-radius:8px;padding:10px 14px;min-width:140px} .kpi b{display:block;font-size:22px}
.insg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.box{background:#1e1e1e;border-radius:8px;padding:10px 12px}
.ai{white-space:pre-wrap;background:#1e1e1e;border-radius:8px;padding:12px 14px;margin:8px 0 14px}

/* Montage Maker */
#mm{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column;align-items:center}
#mm.open{display:flex}
#mm .mmh{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 22px}
#mm .mmh h2{margin:0;font-size:16px;font-weight:600}
#mm .x{width:30px;height:30px;border-radius:50%;background:#2a2a2a;color:var(--acc);display:grid;place-items:center}
#mm .add{background:#2a2a2a;color:var(--acc);border-radius:16px;height:32px;padding:0 16px;font-weight:600}
#mm .mmv{flex:1;min-height:0;width:min(92vw,1100px);display:flex;align-items:center;justify-content:center;padding:6px 0}
#mm .mmv video{max-width:100%;max-height:100%;border-radius:10px;background:#111}
#mm .strip{display:flex;gap:6px;padding:16px 10px;max-width:96vw;overflow-x:auto}
#mm .strip div{width:58px;flex:none;cursor:grab;position:relative}
#mm .strip img{width:58px;height:74px;object-fit:cover;border-radius:6px;border:2px solid transparent;display:block;opacity:.35}
#mm .strip div.in img{opacity:1} #mm .strip div.cur img{border-color:#fff}
#mm .strip span{position:absolute;right:3px;top:3px;font-size:10px;background:var(--acc2);border-radius:8px;padding:0 5px}
#mm .tools{display:flex;gap:26px;padding:6px 0 26px;flex-wrap:wrap;justify-content:center}
#mm .tool{display:flex;flex-direction:column;align-items:center;gap:7px;color:#9a9a9a;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
#mm .tool .c{width:46px;height:46px;border-radius:50%;background:#1f1f1f;color:var(--acc);display:grid;place-items:center}
#mm .tool.on .c{background:#2e2e5a}
#mm .tool .v{color:#ddd;text-transform:none;letter-spacing:0}

/* splash */
#splash{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;cursor:pointer;transition:opacity .6s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .pear{width:min(150px,32vw);height:auto;animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
#splash h1{color:#fff;font:600 clamp(30px,6vw,52px)/1.1 var(--font);letter-spacing:.06em;margin:0;animation:rise 1s .25s cubic-bezier(.2,.7,.2,1) both}
#splash p{color:#fff;opacity:.55;margin:-14px 0 0;font-size:14px;letter-spacing:.18em;text-transform:uppercase;animation:rise 1s .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#3a3a3a;border:1px solid #4a4a4a;padding:8px 14px;border-radius:8px;z-index:60;box-shadow:0 8px 24px #0009}

}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const ico = (n, cls = 's') => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const ts = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(1).padStart(4, '0')}`; };
const parseTs = v => String(v).split(':').reduce((a, p) => a * 60 + parseFloat(p || 0), 0);
const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(Math.round(n || 0));
const tags = v => v.split(/[\s,]+/).map(h => h.replace(/^#/, '')).filter(Boolean);
const tagstr = a => (a || []).map(h => '#' + h).join(' ');
function tcode(t, fps = 30, plain = false) {   // 00:00:05:20 with the leading zeros dimmed
  t = Math.max(0, t || 0); const f = Math.floor((t % 1) * fps), s = Math.floor(t) % 60, m = Math.floor(t / 60) % 60, h = Math.floor(t / 3600);
  const str = [h, m, s, f].map(x => String(x).padStart(2, '0')).join(':'); if (plain) return str;
  const k = str.search(/[1-9]/); return k < 0 ? `<span class="z">${str}</span>` : `<span class="z">${str.slice(0, k)}</span>${str.slice(k)}`;
}
function toast(m) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.append(d); setTimeout(() => d.remove(), 3200); }
async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...opts,
    body: opts.body && typeof opts.body !== 'string' && !(opts.body instanceof FormData) ? JSON.stringify(opts.body) : opts.body});
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m } catch {} toast(m); throw new Error(m); }
  return r.json();
}

let META, STATE = {projects: [], jobs: []}, CUR = null, PROJ = null, SEL = null, SELKIND = 'clip', MODE = 'clip';
let ITAB = 'clip', PTAB = 'ig', PX = 4, PLAYHEAD = 0, fxCat = 'Captions', lastSig = '', INS_JOB = null, VID = null;
let SEEN = new Set(); try { SEEN = new Set(JSON.parse(localStorage.getItem('ds-seen') || '[]')); } catch {}
const clipsSorted = () => PROJ ? [...PROJ.clips].sort((a, b) => (b.score || 0) - (a.score || 0)) : [];
const selClip = () => PROJ && SELKIND === 'clip' ? PROJ.clips.find(c => c.id === SEL) : null;
const fileUrl = f => `/files/${CUR}/${encodeURIComponent(f)}`;
const projJob = () => STATE.jobs.find(j => j.project === CUR && ['running', 'queued'].includes(j.status));

// ------------------------------------------------ splash + layout
function hideSplash() { const s = $('#splash'); if (s && !s.classList.contains('out')) { s.classList.add('out'); setTimeout(() => s.remove(), 700); } }
setTimeout(hideSplash, 2200);
function lay(cls, b) { $('#app').classList.toggle(cls); b.classList.toggle('on'); setTimeout(() => PROJ && drawTimeline(), 60); }

// ------------------------------------------------ polling / background tasks
async function poll() {
  try { STATE = await api('/api/state'); } catch { return; }
  drawTree(); drawTasks();

// ------------------------------------------------ project
async function openProject(slug) {
  if (slug !== CUR) { SEL = null; PROJ = null; }
  CUR = slug; drawTree(); await loadProject(true); zoomFit();
  const first = clipsSorted()[0]; if (first && SEL === null) select('clip', first.id);
}
async function loadProject(force) {
  const p = await api('/api/projects/' + CUR);

  const a = document.activeElement, editing = a && a.closest && a.closest('#ibody') && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName);
  const sig = x => JSON.stringify(x.clips.map(c => [c.id, c.file, c.rendered]));
  const changed = !PROJ || sig(PROJ) !== sig(p);
  PROJ = p;
  $('#pname').textContent = p.video.split('/').pop();
  $('#pdur').innerHTML = tcode(p.info.duration, p.info.fps);

function select(kind, id) {

}
function stepClip(d) {

}

// ------------------------------------------------ viewer

  $('#vfmt').textContent = MODE === 'source' ? `${info.w}×${info.h} ${Math.round(info.fps)}p, Stereo` : `1080×${{'9:16': 1920, '4:5': 1350, '1:1': 1080}[asp] || 1920} ${Math.round(info.fps)}p, Stereo`;
  $('#vtitle').textContent = title;

function startAt() { if (SELKIND === 'chapter' && PROJ.map && PROJ.map[SEL]) return PROJ.map[SEL].start; const c = selClip(); return c ? c.start : (PLAYHEAD || 0); }
function setMode(m) { MODE = m; if (m === 'clip' && !(selClip() && selClip().file)) { toast("This clip isn't rendered yet"); MODE = 'source'; } showViewer(); }
function hookVideo() {

  VID.addEventListener('pause', () => { $('#playIco').innerHTML = '<use href="#i-play"/>'; });
  VID.addEventListener('waiting', () => { if (MODE === 'source') $('#vbadge').textContent = 'Preparing source preview…'; });
  VID.addEventListener('canplay', () => { $('#vbadge').textContent = MODE === 'source' ? 'Source' : SELKIND === 'comp' ? 'Stitched' : 'Clip'; });
}
function tick() { updTc(); if (VID && !VID.paused) requestAnimationFrame(tick); }

  else { const c = selClip(); if (c) PLAYHEAD = c.start + VID.currentTime * (c.end - c.start) / Math.max(0.1, c.length || (c.end - c.start)); }

function cycleRate() { if (!VID) return; const r = [1, 1.5, 2, 0.5]; const i = (r.indexOf(VID.playbackRate) + 1) % r.length; VID.playbackRate = r[i]; $('#rate').textContent = r[i] + '×'; }

function ptab(k) { stashText(); PTAB = k; drawInspector(); }

  sheet('Creator profile', `<p class="mut">The AI reads this — and the stats you enter in each clip's Info tab — every time it picks moments and writes hooks.</p>` +
    f.map(([k, l, ph]) => `<label class="f">${l}</label><textarea data-k="${k}" placeholder="${ph}" style="min-height:40px">${esc(p[k])}</textarea>`).join(''),
    async () => { await api('/api/profile', {method: 'PUT', body: readForm($('#dlgB'))}); dlg.close(); toast('Profile saved'); }, 'Save Profile');
}
async function openInsights() {
  const d = await api('/api/insights');
  const tbl = (t, rows) => `<div class="box"><span class="cap">${t}</span>${rows.length ? `<table class="t"><tr><th></th><th>Clips</th><th>Median views</th><th>Eng.</th></tr>${rows.map(r => `<tr><td>${esc(r.key)}</td><td class="n">${r.clips}</td><td class="n">${fmtN(r.median_views)}</td><td class="n">${(r.avg_rate * 100).toFixed(1)}%</td></tr>`).join('')}</table>` : '<p class="mut">No data yet.</p>'}</div>`;
  const ai = STATE.jobs.find(j => j.kind === 'insights' && j.status === 'done');
  sheet('Insights', `<div class="kpis"><div class="kpi"><b>${d.count}</b><span class="mut">posts tracked</span></div><div class="kpi"><b>${fmtN(d.total_views)}</b><span class="mut">total views</span></div><div class="kpi"><b>${d.top[0] ? fmtN(d.top[0].views) : '–'}</b><span class="mut">best post</span></div>
      <button class="btn pri" style="align-self:center" onclick="askInsights()">${ico('wand')}Ask AI what's working</button></div>
    <div class="ai" id="ins-ai" ${ai ? '' : 'hidden'}>${esc(ai ? ai.result : '')}</div>
    ${d.count ? '' : '<p class="mut">No stats yet. After posting a clip, select it, open the Info tab in the inspector, add the platform, time and numbers, and save. Designer Studio then shows which topics, lengths, caption styles, platforms and posting hours work best — and feeds your best and worst posts to the AI so it picks better moments next time.</p>'}
    <div class="insg">${tbl('By topic', d.by_topic)}${tbl('By length', d.by_length)}${tbl('By caption style', d.by_captions)}${tbl('By platform', d.by_platform)}${tbl('By posting hour', d.by_hour)}</div>
    ${d.top.length ? `<p class="cap" style="margin-top:14px">Top posts</p><table class="t"><tr><th>Hook</th><th>Topic</th><th>Platform</th><th>Length</th><th>Views</th><th>Eng.</th></tr>${d.top.map(t => `<tr><td>${esc(t.title)}</td><td>${esc(t.topic || '')}</td><td>${esc(t.platform)}</td><td class="n">${Math.round(t.length)}s</td><td class="n">${fmtN(t.views)}</td><td class="n">${(t.rate * 100).toFixed(1)}%</td></tr>`).join('')}</table>` : ''}`, null);
  dlg.style.width = 'min(1000px,95vw)'; dlg.addEventListener('close', () => dlg.style.width = '', {once: true});
}
async function askInsights() { const j = await api('/api/insights/ai', {method: 'POST'}); INS_JOB = j.id; $('#ins-ai').hidden = false; $('#ins-ai').textContent = 'Thinking…'; }

// ------------------------------------------------ Montage Maker (stitch)
let MM = {order: [], on: new Set(), trans: 'cut', cur: 0};
function openMontage(trans) {
  if (!PROJ) return toast('Open a project first');
  const ready = PROJ.clips.filter(c => c.file); if (ready.length < 2) return toast('Need at least two rendered clips');
  MM.order = [...ready].sort((a, b) => a.start - b.start).map(c => c.id); MM.on = new Set(MM.order); if (trans) MM.trans = trans;
  if (VID) VID.pause();
  $('#mm').classList.add('open'); mmPlay(0);
}
function closeMontage() { $('#mm').classList.remove('open'); $('#mmv').pause(); }
function drawMM() {
  const byId = Object.fromEntries(PROJ.clips.map(c => [c.id, c])); let k = 0;
  $('#mmstrip').innerHTML = MM.order.map((id, i) => { const c = byId[id], on = MM.on.has(id); if (on) k++;
    return `<div class="${on ? 'in' : ''} ${i === MM.cur ? 'cur' : ''}" draggable="true" title="${esc(c.title)} — click to include/exclude, drag to reorder" onclick="mmToggle(${id})"
      ondragstart="event.dataTransfer.setData('text/plain','${i}')" ondragover="event.preventDefault()" ondrop="mmDrop(event,${i})">
      <img src="${fileUrl(c.file.replace(/\.mp4$/, '.jpg'))}?v=${c.rendered || 0}" alt="">${on ? `<span>${k}</span>` : ''}</div>`; }).join('');
  $('#mmTv').textContent = MM.trans === 'fade' ? 'Crossfade' : 'Cut';
  $('#mmT').classList.toggle('on', MM.trans === 'fade');
}
function mmToggle(id) { MM.on.has(id) ? MM.on.delete(id) : MM.on.add(id); drawMM(); }
function mmDrop(ev, to) { ev.preventDefault(); const from = +ev.dataTransfer.getData('text/plain'); const [x] = MM.order.splice(from, 1); MM.order.splice(to, 0, x); drawMM(); }
function mmOrder(o) { const byId = Object.fromEntries(PROJ.clips.map(c => [c.id, c])); MM.order.sort((a, b) => o === 'score' ? (byId[b].score || 0) - (byId[a].score || 0) : byId[a].start - byId[b].start); mmPlay(0); }
function mmTrans() { MM.trans = MM.trans === 'fade' ? 'cut' : 'fade'; drawMM(); }
function mmAll() { MM.on = new Set(MM.order); drawMM(); }
function mmPlay(i) {   // preview: the chosen clips back to back
  const ids = MM.order.filter(id => MM.on.has(id)); if (!ids.length) { drawMM(); return; }
  const id = ids[i % ids.length], c = PROJ.clips.find(c => c.id === id), v = $('#mmv');
  MM.cur = MM.order.indexOf(id); v.src = fileUrl(c.file) + '?v=' + (c.rendered || 0);
  v.onended = () => { if (i + 1 < ids.length) { mmPlay(i + 1); v.play(); } }; drawMM();
}
async function makeMontage() {
  const ids = MM.order.filter(id => MM.on.has(id)); if (ids.length < 2) return toast('Pick at least two clips');
  await api(`/api/projects/${CUR}/stitch`, {method: 'POST', body: {ids, order: 'custom', transition: MM.trans}});
  closeMontage(); toast('Stitching… it will appear in the browser under Stitched'); poll();
}

// ------------------------------------------------ keys + start
addEventListener('keydown', e => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (e.key === 'Escape' && $('#mm').classList.contains('open')) return closeMontage();
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || dlg.open || $('#mm').classList.contains('open')) return;
  const fps = PROJ ? PROJ.info.fps : 30;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight' && VID) { e.preventDefault(); VID.currentTime += e.shiftKey ? 1 : 1 / fps; }
  else if (e.key === 'ArrowLeft' && VID) { e.preventDefault(); VID.currentTime -= e.shiftKey ? 1 : 1 / fps; }
  else if (e.key === 'ArrowDown') { e.preventDefault(); stepClip(1); } else if (e.key === 'ArrowUp') { e.preventDefault(); stepClip(-1); }
  else if ((e.metaKey || e.ctrlKey) && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoom(1.6); }
  else if ((e.metaKey || e.ctrlKey) && e.key === '-') { e.preventDefault(); zoom(1 / 1.6); }
  else if (e.shiftKey && e.key === 'Z') zoomFit();
});
addEventListener('resize', () => { if (PROJ) drawTimeline(); });
(async () => {
  META = await api('/api/meta'); drawFx(); drawInspector(); updTc();
  await poll(); setInterval(poll, 2000);
  if (STATE.projects[0] && !CUR) openProject(STATE.projects[0].slug);
})();
</script>
